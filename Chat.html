<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --bg: #121212;
  --surface: #000000;
  --line: #262626;
  --text: #ededed;
  --muted: #8f8f8f;
  --mine: #2e7d5b;
  --mine-text: #f2fff8;
  --theirs: #1c1c1c;
  --theirs-text: #e6e6e6;
  --accent: #2e7d5b;
  --accent-text: #f2fff8;
  --peach: #1c1c1c;
  --sky: #2a2a2a;
  --header-bg: #1e4d3b;
  --header-text: #e8f6ee;
  --header-sub: #a9d3bc;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 720px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--header-bg);
  color: var(--header-text);
  border-bottom: 1px solid #173d2e;
}
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--sky);
  display: grid; place-items: center;
  font-weight: 700;
  color: var(--text);
}
header h1 { font-size: 16px; font-weight: 700; }
header p { font-size: 13px; color: var(--header-sub); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9fd8b7; margin-right: 6px; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg {
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.msg.mine { align-self: flex-end; background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 6px; }
.msg.theirs { align-self: flex-start; background: var(--theirs); color: var(--theirs-text); border-bottom-left-radius: 6px; }
.time { display: block; font-size: 11px; opacity: .65; margin-top: 4px; }
.empty { margin: auto; color: var(--muted); font-size: 14px; text-align: center; }
.composer {
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid var(--line);
}
.composer input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  border-radius: 999px;
  padding: 12px 18px;
  font: inherit;
  font-size: 15px;
}
.composer input:focus-visible, .composer button:focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; }
.composer button {
  border: 0;
  background: var(--accent);
  color: var(--accent-text);
  font: inherit;
  font-weight: 700;
  padding: 0 22px;
  border-radius: 999px;
  cursor: pointer;
}
.composer button:hover { filter: brightness(.96); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">M</div>
    <div>
      <h1>Mina</h1>
      <p><span class="dot"></span>Online</p>
    </div>
  </header>
  <div id="messages" role="log" aria-live="polite"></div>
  <div class="composer">
    <input id="input" type="text" placeholder="Write a message" autocomplete="off" aria-label="Message">
    <button id="send" type="button">Send</button>
  </div>
</div>
<script>
const box = document.getElementById('messages');
const input = document.getElementById('input');
function stamp() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function add(text, who) {
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  const t = document.createElement('span');
  t.className = 'time';
  t.textContent = stamp();
  el.appendChild(t);
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}
function send() {
  const text = input.value.trim();
  if (!text) return;
  add(text, 'mine');
  input.value = '';
  // Demo reply: replace this with your real send/receive logic (WebSocket, fetch, etc.)
  setTimeout(() => add('Got it, thanks for your message.', 'theirs'), 600);
}
document.getElementById('send').addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
box.innerHTML = '<p class="empty">No messages yet. Say hello.</p>';
add('Hi there, how can I help?', 'theirs');
</script>
</body>
</html>
